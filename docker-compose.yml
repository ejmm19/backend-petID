services:
  fastapi:
    build: .
    container_name: fastapi_app
    ports:
      - "8019:8000"
    depends_on:
      db:
        condition: service_healthy  # ✅ Esperar hasta que MySQL esté listo
    environment:
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: fastapi_db
    volumes:
      - .:/app
    networks:
      - fastapi_network

  db:
    image: mysql:8.0
    container_name: fastapi_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fastapi_db
    ports:
      - "3387:3306"
    networks:
      - fastapi_network
    healthcheck:  # ✅ Espera a que MySQL esté listo antes de iniciar FastAPI
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      retries: 5
      interval: 10s
      timeout: 5s

networks:
  fastapi_network:
    driver: bridge
